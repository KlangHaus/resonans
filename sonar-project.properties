# SonarQube on our own instance (sonar.klanghaus.dk). Allan 2026-10-27:
# resonans left Jenkins and gets SonarQube through Actions, on grundtone's
# pattern. Where this file differs from grundtone's, it says why.
# The key SonarQube generated when the project was created, kept as is: the
# other KlangHaus repositories use theirs the same way (grundtone, auth, ...).
# It must match SONAR_PROJECT_KEY in .github/workflows/sonar.yml.
sonar.projectKey=KlangHaus_resonans_7e9bb7e1-ee71-479d-9904-a02be28f4d30
sonar.projectName=resonans
sonar.sourceEncoding=UTF-8

# What is ours to analyse: the Go service (cmd/, internal/, migrations/), the
# Studio editor's own code (app/, server/) and the release/CI scripts.
#
# NOT here, on purpose: examples/ is a demo site for people to copy, not part
# of the product; docs/ is prose; studio/.nuxt and .output are generated.
sonar.sources=cmd,internal,migrations,scripts,studio/app,studio/server

# Tests are NAMED, not left out — left out, Sonar counts them as untested
# production code. Go tests sit beside their package, as do the Studio's, so
# both lists cover the same directories and test.inclusions tells them apart.
sonar.tests=cmd,internal,studio/app
sonar.test.inclusions=**/*_test.go,**/*.test.ts

# A file must not be both a source and a test, or the scanner refuses to
# index it twice: the test patterns are excluded from the sources here.
sonar.exclusions=**/*_test.go,**/*.test.ts,**/testdata/**,**/node_modules/**,**/.nuxt/**,**/.output/**,**/coverage/**,**/*.d.ts

# 🔴 Coverage, both languages. Without these lines Sonar reports 0 % and a
# zero reads as a regression, not as a missing configuration. The workflow
# asserts both files exist, are non-empty and name real paths BEFORE the
# scanner runs.
#
# Go: one profile from `go test -tags=integration ./...` against a real
# Postgres, so the stores production runs (content, media, settings, app) are
# measured WITH their database cells — the unit-only numbers for those
# packages are ceilings, not coverage (coverage-floors-integration.json).
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=go-test-report.json
# Studio: vitest's lcov, paths made absolute by the workflow (vitest writes
# them relative to studio/, the scanner resolves from the repository root).
sonar.javascript.lcov.reportPaths=studio/coverage/lcov.info

# The scripts are release and CI gates (Python). Each one is exercised by its
# own `--selftest` in CI, which Sonar cannot see, so its coverage would read 0 %
# for a reason that is not "untested". Only the coverage DENOMINATOR is
# excluded: issues, hotspots and duplication are still measured.
# EXIT CONDITION: drop this the day the scripts get unit tests Sonar can read.
sonar.coverage.exclusions=scripts/**
