version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies are closed
    - errorlint # correct errors.Is/As usage and %w wrapping
    - misspell
    - unconvert # redundant type conversions
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KlangHaus/resonans
