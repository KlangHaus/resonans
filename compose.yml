# Resonans — self-hosted headless CMS. One file, four services, no accounts.
#
#   cp .env.example .env    # then fill in the passwords and your login provider
#   docker compose up -d --build
#
# Editor at http://localhost:8080, content API at http://localhost:3000.
# `--build` builds both images from this checkout. No registry account is needed.
# To try it with no login provider of your own, see compose.try.yml.
#
# What this stack does NOT do, on purpose: terminate TLS, and expose anything on
# a public address. Docker publishes a port on every interface unless told
# otherwise, so both ports bind to BIND_ADDRESS, by default 127.0.0.1. Put your
# own reverse proxy in front — Caddy, nginx, Traefik, whatever you already run. A
# compose file that quietly published an editor to the internet would be the wrong
# default for the only person who can judge that: you.

name: resonans

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resonans
      POSTGRES_USER: resonans_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by deploy/initdb/10-app-role.sql to create the non-bypassing role
      # the server connects as. See that file for why the two roles are split.
      RESONANS_APP_PASSWORD: ${RESONANS_APP_PASSWORD:?set RESONANS_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb scripts run ONLY on an empty data directory. Changing this file
      # after the first start has no effect — drop the volume or apply the SQL
      # by hand.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h: over TCP, not the socket. While it initialises, the image runs a temporary
      # server on the socket only, which reports ready before the real one starts, so
      # migrate's connection is refused on a machine slow enough to get there first.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U resonans_migrator -d resonans"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot. In production Resonans does NOT migrate at boot, because the
  # server connects as a role with no DDL privileges. This runs as the migrator.
  migrate:
    image: ghcr.io/klanghaus/resonans:${RESONANS_VERSION:-latest}
    build: .
    command: ["migrate"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://resonans_migrator:${POSTGRES_PASSWORD:?}@postgres:5432/resonans
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ghcr.io/klanghaus/resonans:${RESONANS_VERSION:-latest}
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The externally reachable base URL of the API. Asset URLs are built from
      # it, so a wrong value here shows up as broken images rather than as an
      # error anywhere.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgres://resonans_app:${RESONANS_APP_PASSWORD:?}@postgres:5432/resonans
      # Asset bytes on a local volume. Without this (or a full BUNNY_STORAGE_*
      # set) the server REFUSES to start in production, because the in-memory
      # fallback loses every upload on restart.
      RESONANS_STORAGE_DIR: /var/lib/resonans/assets
      # Trusted server-to-server read surface. Required in production: unset, it
      # would trust an unauthenticated tenant header.
      RESONANS_DELIVERY_TOKEN: ${RESONANS_DELIVERY_TOKEN:?set RESONANS_DELIVERY_TOKEN in .env}
      RESONANS_PREVIEW_SECRET: ${RESONANS_PREVIEW_SECRET:-}
      # Editor login (ADR 0001). Issuer, JWKS and audience must all be set or
      # the server refuses to start — see .env.example for what to point them at.
      RESONANS_JWT_ISSUER: ${RESONANS_JWT_ISSUER:?set RESONANS_JWT_ISSUER in .env}
      RESONANS_JWKS_URL: ${RESONANS_JWKS_URL:?set RESONANS_JWKS_URL in .env}
      RESONANS_JWT_AUDIENCE: ${RESONANS_JWT_AUDIENCE:?set RESONANS_JWT_AUDIENCE in .env}
      # Exactly 1 waives the https requirement above. See .env.example.
      RESONANS_ALLOW_INSECURE_JWKS: ${RESONANS_ALLOW_INSECURE_JWKS:-}
      RESONANS_ROLE_CLAIM: ${RESONANS_ROLE_CLAIM:-resonans_role}
      RESONANS_ROLE_MAP: ${RESONANS_ROLE_MAP:-}
      RESONANS_TENANT_MODE: ${RESONANS_TENANT_MODE:-multi}
      RESONANS_TENANT_ID: ${RESONANS_TENANT_ID:-}
      RESONANS_TENANT_CLAIM: ${RESONANS_TENANT_CLAIM:-org}
      # AGPL-3.0 §13: if you modify Resonans and offer it over a network, point
      # this at YOUR source so the offer on /healthz is true.
      RESONANS_SOURCE_URL: ${RESONANS_SOURCE_URL:-}
      # The language delivered when a request names none. See .env.example.
      RESONANS_DEFAULT_LOCALE: ${RESONANS_DEFAULT_LOCALE:-da}
    volumes:
      - assets_data:/var/lib/resonans/assets
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  studio:
    image: ghcr.io/klanghaus/resonans-studio:${RESONANS_VERSION:-latest}
    build: ./studio
    restart: unless-stopped
    environment:
      # The editor's server is the OIDC client (ADR 0001): it talks to the
      # provider and to the API itself, so the browser never holds a token.
      # Positive opt-in. Without an issuer there is no login at all, which is
      # why compose requires it: a CMS whose editor opens for anyone is not a
      # default we get to pick for you.
      NUXT_OIDC_ISSUER: ${RESONANS_JWT_ISSUER:?set RESONANS_JWT_ISSUER in .env}
      NUXT_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      NUXT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      NUXT_OIDC_SESSION_SECRET: ${EDITOR_SESSION_SECRET:?set EDITOR_SESSION_SECRET in .env}
      # Only for providers that issue a JWT for a resource-bound grant alone.
      NUXT_OIDC_RESOURCE: ${OIDC_RESOURCE:-}
      # Add the scope your provider needs for the role claim, e.g. `groups`.
      NUXT_OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      # Exactly 1 allows a provider over plain http. Same waiver as the API's.
      NUXT_OIDC_ALLOW_INSECURE: ${RESONANS_ALLOW_INSECURE_JWKS:-}
      # Exactly 1: logout fails, and you stay logged in, if the provider stops
      # advertising an end_session_endpoint.
      NUXT_OIDC_REQUIRE_PROVIDER_LOGOUT: ${OIDC_REQUIRE_PROVIDER_LOGOUT:-}
      # As the editor's BROWSER reaches it — the redirect URI is built from it.
      NUXT_OIDC_EDITOR_URL: ${EDITOR_URL:-http://localhost:8080}
      # Inside this network: the editor's server calls the API directly.
      NUXT_OIDC_API_URL: http://api:3000
      # The interface language: en or da.
      NUXT_PUBLIC_EDITOR_LOCALE: ${EDITOR_LOCALE:-en}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STUDIO_PORT:-8080}:3000"
    depends_on:
      api: { condition: service_started }

volumes:
  postgres_data:
  assets_data:
