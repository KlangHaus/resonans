# Dex for compose.try.yml. Local trial only: the mock connector logs anyone in.
issuer: http://dex.localhost:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
connectors:
  - type: mockCallback
    id: mock
    name: Try it (no password)
staticClients:
  - id: resonans-editor
    name: Resonans editor
    secret: try-local-only-client-secret
    # 8080 is the README's port. 3010 is for running beside another stack that
    # holds 8080 (STUDIO_PORT=3010, see Tiltfile).
    redirectURIs:
      - http://localhost:8080/auth/callback
      - http://localhost:3010/auth/callback
