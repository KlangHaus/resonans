type: post
fields:
  - { name: excerpt, type: text, i18n: true }
  - name: body
    type: blocks
    allow: [rich_text, image, callout, code, iframe_embed, video_embed, cta, columns]
  - { name: author, type: string }
  - { name: category, type: string }
  - { name: coverImage, type: asset }
list:
  columns: [title, author, category, status, updatedAt]
