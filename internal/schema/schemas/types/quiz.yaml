# Quiz doc-type — referenced from a lesson's quiz block (quizRef).
#
# SECURITY: a quiz document carries the answer key (options.correct →
# correctOptionIds) + explanation. Delivery serves the FULL document over the
# trusted service channel; REDACTION IS THE CONSUMER'S RESPONSIBILITY (Etude's
# Nitro strips correct/explanation before the browser, grades server-side).
# Resonans never redacts (it has no learner state). See internal/delivery
# (quiz shaping) + /delivery/v1/schema marks this type server-side-only.
type: quiz
fields:
  - { name: question, type: string, i18n: true, required: true }
  - { name: type, type: string } # single | multiple
  - name: options
    type: array
    of:
      - { name: id, type: string, required: true }
      - { name: label, type: string, i18n: true, required: true }
      - { name: correct, type: boolean }
  - { name: explanation, type: string, i18n: true }
list:
  columns: [title, status, updatedAt]
