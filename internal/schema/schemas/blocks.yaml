# Resonans shared block library. Defined once; each doc-type's `body` field
# declares an `allow` subset. i18n:true = field-level translated. Field names
# align to the [etude]-locked delivery contract (§F) so delivery is passthrough
# (image/download/quiz get small delivery-side shaping — see internal/delivery).
blocks:
  # ── Content blocks ──────────────────────────────────────
  - name: rich_text
    fields:
      - { name: value, type: richtext, i18n: true, required: true }
      - { name: format, type: string } # "portable_text" (default) | "html"

  - name: video_embed # references a Vimeo video; player-resolution is Etude's
    fields:
      - { name: provider, type: string } # "vimeo" | "bunny"
      - { name: videoId, type: string, required: true }
      - { name: title, type: string, i18n: true }

  - name: image
    fields:
      - { name: asset, type: asset, required: true }
      - { name: alt, type: string, i18n: true } # delivery moves this into `asset`
      - { name: caption, type: string, i18n: true }

  - name: callout
    fields:
      - { name: variant, type: string } # info | warn | tip
      - { name: value, type: richtext, i18n: true }

  - name: code
    fields:
      - { name: language, type: string }
      - { name: value, type: text, required: true }
      - { name: filename, type: string }

  - name: download
    fields:
      - { name: asset, type: asset, required: true }
      - { name: label, type: string, i18n: true }
      - { name: description, type: string, i18n: true }

  - name: iframe_embed
    fields:
      - { name: url, type: string, required: true }
      - { name: title, type: string, i18n: true }
      - { name: aspectRatio, type: string }

  # quiz block references a quiz document; the quiz content (question + answer
  # key) lives in the `quiz` doc-type, delivered server-side-only (Etude redacts).
  - name: quiz
    fields:
      - { name: quizRef, type: reference, ref: quiz, required: true }

  # ── Marketing blocks (Page/Post) ────────────────────────
  - name: hero
    fields:
      - { name: heading, type: string, i18n: true, required: true }
      - { name: subheading, type: string, i18n: true }
      - { name: image, type: asset }
      - { name: ctaLabel, type: string, i18n: true }
      - { name: ctaHref, type: string }

  - name: feature_grid
    fields:
      - name: features
        type: array
        of:
          - { name: title, type: string, i18n: true, required: true }
          - { name: body, type: string, i18n: true }
          - { name: icon, type: string }

  - name: cta
    fields:
      - { name: heading, type: string, i18n: true }
      - { name: label, type: string, i18n: true, required: true }
      - { name: href, type: string, required: true }

  - name: quote
    fields:
      - { name: quote, type: string, i18n: true, required: true }
      - { name: author, type: string }
      - { name: role, type: string }

  # ── Container (nesting, 1 level) ────────────────────────
  - name: columns
    fields:
      - name: columns
        type: array
        of:
          - name: content
            type: blocks
            allow: [rich_text, image, callout, code, download, iframe_embed, video_embed, quiz, cta]
