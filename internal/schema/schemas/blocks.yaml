# Resonans shared block library. Defined once; each doc-type's `body` field
# declares an `allow` subset. i18n:true = field-level translated (value keyed by
# locale). Content blocks + marketing blocks live here together — one library,
# right blocks per domain via the per-doc-type allowlist.
blocks:
  # ── Content blocks ──────────────────────────────────────
  - name: rich-text
    fields:
      - { name: content, type: richtext, i18n: true, required: true }

  - name: video-embed # references a Vimeo video (video-hosting stays in Vimeo)
    fields:
      - { name: provider, type: string } # default "vimeo"
      - { name: videoId, type: string, required: true }
      - { name: title, type: string, i18n: true }
      - { name: caption, type: string, i18n: true }
      - { name: autoplay, type: boolean }

  - name: image
    fields:
      - { name: asset, type: asset, required: true }
      - { name: alt, type: string, i18n: true }
      - { name: caption, type: string, i18n: true }

  - name: callout
    fields:
      - { name: variant, type: string } # info | warning | tip | note
      - { name: title, type: string, i18n: true }
      - { name: body, type: richtext, i18n: true }

  - name: code
    fields:
      - { name: language, type: string }
      - { name: code, type: text, required: true }
      - { name: filename, type: string }

  - name: download
    fields:
      - { name: file, type: asset, required: true }
      - { name: label, type: string, i18n: true }
      - { name: description, type: string, i18n: true }

  - name: iframe-embed
    fields:
      - { name: url, type: string, required: true }
      - { name: title, type: string, i18n: true }
      - { name: aspectRatio, type: string }

  - name: quiz # question authored here; answering/scoring/progress lives in Etude
    fields:
      - { name: question, type: string, i18n: true, required: true }
      - { name: type, type: string } # single | multiple
      - name: options
        type: array
        of:
          - { name: text, type: string, i18n: true, required: true }
          - { name: correct, type: boolean }
      - { name: explanation, type: string, i18n: true }

  # ── Marketing blocks (Page/Post) ────────────────────────
  - name: hero
    fields:
      - { name: heading, type: string, i18n: true, required: true }
      - { name: subheading, type: string, i18n: true }
      - { name: image, type: asset }
      - { name: ctaLabel, type: string, i18n: true }
      - { name: ctaHref, type: string }

  - name: feature-grid
    fields:
      - name: features
        type: array
        of:
          - { name: title, type: string, i18n: true, required: true }
          - { name: body, type: string, i18n: true }
          - { name: icon, type: string }

  - name: cta
    fields:
      - { name: heading, type: string, i18n: true }
      - { name: label, type: string, i18n: true, required: true }
      - { name: href, type: string, required: true }

  - name: testimonial
    fields:
      - { name: quote, type: string, i18n: true, required: true }
      - { name: author, type: string }
      - { name: role, type: string }

  # ── Container (nesting, 1 level) ────────────────────────
  - name: columns
    fields:
      - name: columns
        type: array
        of:
          - name: content
            type: blocks
            allow: [rich-text, image, callout, code, download, iframe-embed, video-embed, quiz, cta]
