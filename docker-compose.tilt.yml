# Local dev stack for Resonans (Beslutning P — Tilt-on-Compose).
# Brings up Postgres + the CMS with migrations run at boot.
#
#   docker compose -f docker-compose.tilt.yml up --build
#
# Prod runs as a workload in infra/compose/prod/vm2-ops/ against the shared
# ops-Postgres — this file is dev-only and does NOT model that topology.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resonans
      POSTGRES_PASSWORD: resonans
      POSTGRES_DB: resonans
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonans"]
      interval: 5s
      timeout: 3s
      retries: 10

  resonans:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      PUBLIC_URL: http://localhost:3000
      RESONANS_DEFAULT_SITE: klanghaus.dk
      DATABASE_URL: postgres://resonans:resonans@postgres:5432/resonans
      # Dev-only editor token; prod uses BetterAuth-JWT (follow-up).
      EDITOR_API_TOKEN: dev-editor-token
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
