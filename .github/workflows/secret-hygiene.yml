# Secret hygiene — a secret this repo consumes is gated by an environment, or it is named.
#
# Ported from KlangHaus/grundtone@36f9227c (.github/workflows/secret-hygiene.yml). The guard
# itself is scripts/secret-hygiene.mjs, which carries the rationale.
#
# Public repo = GitHub Actions, private = Jenkins (Allan 2026-10-22). A Jenkins build's token
# reaches only its own repository, and resonans is not a Jenkins job, so the repo audits itself,
# with no org-scoped token and without adding a credential in order to audit credentials.
#
# 🔴 THE SCHEDULE IS NOT A NICETY. Surface B measures SETTINGS, and settings change without a
# commit: someone removes a branch policy in the web UI and no pull_request ever runs. A PR-only
# check would be armed against only half of what this exists for.
name: Secret hygiene

on:
  pull_request:
    # Catches a new secret reference while it is still a proposal.
    paths:
      - '.github/workflows/**'
      - 'scripts/secret-hygiene.mjs'
      - 'scripts/secret-hygiene.test.mjs'
      - 'scripts/lib/secret-hygiene.mjs'
      - 'scripts/lib/secret-hygiene.test.mjs'
      - 'scripts/lib/secret-hygiene.cells.json'
  push:
    branches: [main]
  schedule:
    # Daily, so a settings change made outside a commit is found within a day.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The repo's OWN pins, not versions chosen here: checkout as in actionlint.yml, cla.yml,
      # gitleaks.yml and sonar.yml; setup-node as in sonar.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node every other workflow here uses (`node-version: '22'` in ci-go.yml,
          # ci-studio.yml, semantic-release.yml and sonar.yml); this repo has no .nvmrc.
          node-version: '22'

      # No `npm ci`: the guard is plain .mjs with no dependencies on purpose. A hygiene check that
      # needs an install can be taken down by an install failure, and then it reports nothing
      # instead of reporting a problem.
      - name: Self-test (the instrument must be valid before its verdict counts)
        run: node scripts/secret-hygiene.mjs --self-test

      # The same cells under node:test, plus the exit-code cells that run the guard as a process
      # against a local stand-in for the GitHub API.
      - name: Unit and exit-code cells
        run: node --test scripts/lib/secret-hygiene.test.mjs scripts/secret-hygiene.test.mjs

      # 🔴 SEQUENCE, not aggregate: if the self-test fails the guard's verdict means nothing, so it
      # must not run and be read. Inside the guard the two surfaces ARE aggregated, so one red does
      # not silence the other.
      - name: Measure
        env:
          # Repository read is enough for GET /repos/{owner}/{repo}/environments on a public repo.
          # A 403/404 is reported as an INSTRUMENT error naming the subject (exit 2), never as a
          # pass and never as a violation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/secret-hygiene.mjs
