name: Release

# Build and publish a container image to GHCR on every semver tag push, plus
# always on main so the latest-main image stays current. Versioning = semver
# git tags + matching GHCR image tags.

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  # Called directly by semantic-release after it cuts a tag. The tag-push
  # trigger above has NEVER fired: eight tags (v1.1.0..v1.6.2) produced zero
  # semver images, because the release commit carries [skip ci] and the tag
  # points at exactly that commit. An event that silently does not fire is
  # indistinguishable from one with nothing to do — so do not depend on it.
  # Calling the build makes the outcome a consequence of the release job
  # itself, which either succeeds visibly or fails visibly.
  workflow_call:
    inputs:
      ref:
        description: Tag or sha to build.
        required: true
        type: string
  # Manual build against any ref. Two purposes: verify the release path without
  # waiting for a release to happen, and rebuild the semver images that were
  # never produced while the tag trigger was silent (v1.1.0..v1.6.2).
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or sha to build (e.g. v1.7.0).
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless OIDC

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-push:
    name: build + push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # github.sha is the CALLER's commit on a workflow_call — not the ref we
      # just checked out. Stamping it would label the image with a revision it
      # was not built from, which is exactly the drift these labels exist to
      # rule out. Read the sha from the checkout instead.
      - id: rev
        name: resolve built revision
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=7 HEAD)"

          # main-HEAD is read from GitHub AT BUILD TIME, never from github.sha:
          # on a workflow_call/dispatch that context holds the CALLER's commit,
          # which is how an image built from v1.7.0 came to wear `latest`.
          #
          # Fail-closed by construction: if the lookup fails, main_head stays
          # empty, never equals sha, and latest/main are simply not applied. A
          # missing tag is visible on the next pull; a wrong one is invisible
          # until someone deploys older code — which is the state this fixes.
          main_head="$(git ls-remote origin refs/heads/main | cut -f1 || true)"
          if [ -n "$main_head" ] && [ "$sha" = "$main_head" ]; then
            is_main_head=true
          else
            is_main_head=false
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "is_main_head=${is_main_head}" >> "$GITHUB_OUTPUT"
          echo "::notice::building revision ${sha} · main-HEAD=${main_head:-<lookup failed>} · latest/main: ${is_main_head}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # latest=false: the action sets `latest` ON ITS OWN whenever a semver
          # tag matches (flavor default is latest=auto). That implicit default
          # is a dependency exactly like the github.* context — gating our own
          # raw tag below disabled only OUR path, and the action's ran beside
          # it. Measured: a dispatch of v1.7.0 logged `latest/main: false` and
          # still moved `latest` onto the old image. Only the gated raw tag
          # below may set it.
          flavor: |
            latest=false
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # Every tag below is derived from the CHECKOUT, never from the
            # github.* context. On a workflow_call/dispatch that context
            # describes the caller, so `type=sha` and `type=ref` would name a
            # commit the image does not contain.
            type=raw,value=sha-${{ steps.rev.outputs.short }}
            # value= is required here: metadata-action derives semver from
            # github.ref, which on a workflow_call/dispatch is the CALLER's ref
            # (refs/heads/main) — not the tag we checked out. Without it the
            # pattern matches nothing and the image never gets its version tag,
            # which is exactly how eight releases produced zero semver images.
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref }}
            # Moving tags are applied only when the built revision IS main's
            # head — which admits real releases (the release commit is main's
            # head when it is cut) and excludes a dispatch of an old ref,
            # without needing a rule about who ran it.
            #
            # What this actually guarantees: `latest` never names a revision
            # that was not main's head at build time — never WRONG, possibly
            # STALE. It is not "never older than main": if a build for main's
            # head fails, `latest` stays on an earlier, once-correct revision.
            # The guard below enforces this property, not the stronger one.
            type=raw,value=main,enable=${{ steps.rev.outputs.is_main_head == 'true' }}
            type=raw,value=latest,enable=${{ steps.rev.outputs.is_main_head == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          # ANNOTATIONS are generated by the action from the github context when
          # we do not set them. Measured on the published image: they were
          # absent ENTIRELY — build-push does not inherit them, so the value was
          # computed and thrown away (see its annotations input below).
          #
          # An earlier version of this comment claimed one image carried two
          # disagreeing revisions. That was wrong: the disagreement lived in the
          # action's output JSON and never reached the registry. Set from the
          # same source as the labels so the value is right when it does land.
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # Assertion on the OUTCOME, not on our configuration. `flavor: latest=false`
      # removes the path we know about; this catches any path we do not — an
      # implicit default in a future action version, a pattern that grows a
      # `latest` of its own. The question is bounded ("is latest in the computed
      # list?") instead of unbounded ("what else could set latest?").
      #
      # Note: latest=auto lives in the action's README and code, not in a
      # default key in action.yml — reading the schema would not have found it.
      - name: latest må kun stå på lister for main-HEAD
        env:
          TAG_NAMES: ${{ steps.meta.outputs.tag-names }}
          IS_MAIN_HEAD: ${{ steps.rev.outputs.is_main_head }}
        run: |
          set -euo pipefail
          # Fail closed on an empty list: an assertion over nothing is armed at
          # nothing, and would pass forever if the output were ever renamed.
          if [ -z "$TAG_NAMES" ]; then
            echo "::error title=Tag-listen er tom::steps.meta.outputs.tag-names gav ingenting. Assertionen kan ikke måle, og en umålt liste behandles som en fejlet."
            exit 1
          fi
          # A port opens only on a positively declared safe value. is_main_head
          # is 'true' or 'false' and nothing else; anything else means the
          # producer did not answer. Without this, `is_main_head=''` plus a list
          # without `latest` reads as green — and that is exactly the silent
          # state: the raw line's enable also fails to match, so `latest` stops
          # moving while every signal says fine.
          if [ "$IS_MAIN_HEAD" != "true" ] && [ "$IS_MAIN_HEAD" != "false" ]; then
            echo "::error title=is_main_head er ikke afgjort::Værdien var '$IS_MAIN_HEAD' — hverken 'true' eller 'false'. Trinnet der fastslår den kørte ikke, eller nåede ikke frem. Vagten kan ikke måle, og en umålt tag-liste behandles som en fejlet."
            exit 1
          fi
          if [ "$IS_MAIN_HEAD" != "true" ] && printf '%s\n' "$TAG_NAMES" | grep -qx 'latest'; then
            echo "beregnet tag-liste:"; printf '%s\n' "$TAG_NAMES" | sed 's/^/  - /'
            echo "::error title=latest på et ikke-main-HEAD build::Den beregnede tag-liste indeholder 'latest', men den byggede revision er ikke main-HEAD. Noget uden for vores felter satte det. Liste: $(printf '%s\n' "$TAG_NAMES" | tr '\n' ' ')"
            exit 1
          fi
          # The other direction, and it is new debt this PR created: removing
          # latest=auto made the gated raw line the ONLY source. The auto
          # default used to cover forgetfulness by accident. Break `enable`, or
          # let is_main_head go empty, and `latest` silently stops moving — with
          # a green guard beside it. A one-sided assertion would not notice.
          if [ "$IS_MAIN_HEAD" = "true" ] && ! printf '%s\n' "$TAG_NAMES" | grep -qx 'latest'; then
            echo "beregnet tag-liste:"; printf '%s\n' "$TAG_NAMES" | sed 's/^/  - /'
            echo "::error title=latest MANGLER på et main-HEAD build::Den byggede revision ER main-HEAD, men 'latest' står ikke i den beregnede tag-liste. Den gatede raw-linje er eneste kilde — enten er dens enable-betingelse brudt, eller is_main_head nåede ikke frem. Liste: $(printf '%s\n' "$TAG_NAMES" | tr '\n' ' ')"
            exit 1
          fi
          # A workflow command is ONE line: a multi-line value is cut at the
          # first newline. Measured: the notice showed `sha-2869576` of three
          # tags, and the error showed `1.7.0` of three — the half a reader
          # needs least when asking WHICH tags were computed. Print the list on
          # its own lines, outside the command.
          echo "tag-liste (is_main_head=$IS_MAIN_HEAD):"
          printf '%s\n' "$TAG_NAMES" | sed 's/^/  - /'
          echo "::notice::tag-liste OK — $(printf '%s\n' "$TAG_NAMES" | tr '\n' ' ')"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # build-push-action does NOT inherit annotations from metadata-action;
          # the input must be wired. Measured on the published image before this
          # line existed: manifest.annotations was absent entirely, so the value
          # was computed and thrown away. Same shape as the latest finding —
          # enumerate the WHOLE path to the point of consumption, not just the
          # step that produces the value.
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}

      # J4 — kanonisk DIGEST-reference. Signaturer/attestationer gemmes i
      # registry'et pr. DIGEST, ikke pr. tag, så én operation mod digestet
      # dækker alle tags der peger på det. Digest-referencen gør også SBOM'en
      # immun over for at et mutérbart tag (latest/main) flyttes af et
      # samtidigt run mellem build og scanning.
      - id: ref
        name: canonical digest reference
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          first="${TAGS%%$'\n'*}"           # metadata-action: ét tag pr. linje
          echo "image=${first%%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # J4 — cosign keyless signing (OIDC, ingen long-lived key)
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign
        run: cosign sign --yes "${{ steps.ref.outputs.image }}"

      # J4 - Syft SBOM of EXACTLY the built digest (local file; cosign attest
      # carries the guarantee -> NO actions:write). The action is pinned to an
      # immutable commit SHA, because a mutable major tag could change behaviour
      # without review. The version that SHA corresponds to is the trailing
      # comment on the `uses:` line itself; this block deliberately does not
      # repeat it, because a number written in two places goes stale in one of
      # them - it read v0.24.0 for a while after #115 moved the pin to v0.24.3.
      #
      # The pin also fixes the SBOM GENERATOR, which is less obvious: the Syft
      # version is a compile-time constant inside the action's own bundle
      # (getSyftVersion() returns getInput("syft-version") || that constant), so
      # bumping the action moves the tool that produces the document we attest.
      # #115 moved it from Syft v1.42.3 to v1.54.0 - twelve minor versions - and
      # the diff showed only a commit SHA.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Ground truth, printed and nothing more. Whether the attested document
      # records its own generator has never been measured: the run log does not
      # carry the SBOM body, and reading it back from the registry needs access
      # nobody here has (anonymous pulls answer 403). But the predicate file is
      # readable right here, before it is attested - the same bytes, earlier in
      # the chain, no credentials.
      #
      # This step CANNOT fail the run: continue-on-error, a script that always
      # exits 0, and nothing downstream reads it. An assertion in this position
      # would fire after the image is pushed and signed, turning a tooling bump
      # into a release outage found at the worst moment. Measure first, condition
      # later - and only against a value that has actually been read.
      - name: record what the SBOM says about its own generator (print only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os
          import sys

          PATH = "sbom.spdx.json"
          PREFIX = "SBOM-GENERATOR:"

          try:
              if not os.path.exists(PATH):
                  print(f"{PREFIX} FILE MISSING - {PATH} does not exist")
                  sys.exit(0)

              size = os.path.getsize(PATH)
              print(f"{PREFIX} bytes={size}")
              if size == 0:
                  print(f"{PREFIX} FILE EMPTY - 0 bytes")
                  sys.exit(0)

              try:
                  with open(PATH, encoding="utf-8") as handle:
                      doc = json.load(handle)
              except Exception as exc:
                  print(f"{PREFIX} UNPARSEABLE - {type(exc).__name__}: {exc}")
                  sys.exit(0)

              info = doc.get("creationInfo") or {}
              print(f"{PREFIX} name={doc.get('name')!r}")
              print(f"{PREFIX} spdxVersion={doc.get('spdxVersion')!r}")
              print(f"{PREFIX} created={info.get('created')!r}")

              creators = info.get("creators")
              if not creators:
                  print(f"{PREFIX} CREATORS ABSENT OR EMPTY - creationInfo.creators={creators!r}")
                  sys.exit(0)

              print(f"{PREFIX} CREATORS PRESENT - count={len(creators)}")
              for i, creator in enumerate(creators):
                  print(f"{PREFIX} creators[{i}]={creator!r}")
          except Exception as exc:
              # This step must never be the reason a release stops.
              print(f"{PREFIX} STEP ERROR - {type(exc).__name__}: {exc}")
          sys.exit(0)
          PY
          exit 0

      - name: cosign attach SBOM
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson "${{ steps.ref.outputs.image }}"

