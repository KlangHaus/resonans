name: Release

# Build and publish a container image to GHCR on every semver tag push, plus
# always on main so the latest-main image stays current. Versioning = semver
# git tags + matching GHCR image tags.

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  # Called directly by semantic-release after it cuts a tag. The tag-push
  # trigger above has NEVER fired: eight tags (v1.1.0..v1.6.2) produced zero
  # semver images, because the release commit carries [skip ci] and the tag
  # points at exactly that commit. An event that silently does not fire is
  # indistinguishable from one with nothing to do — so do not depend on it.
  # Calling the build makes the outcome a consequence of the release job
  # itself, which either succeeds visibly or fails visibly.
  workflow_call:
    inputs:
      ref:
        description: Tag or sha to build.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless OIDC

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-push:
    name: build + push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # github.sha is the CALLER's commit on a workflow_call — not the ref we
      # just checked out. Stamping it would label the image with a revision it
      # was not built from, which is exactly the drift these labels exist to
      # rule out. Read the sha from the checkout instead.
      - id: rev
        name: resolve built revision
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "::notice::building revision ${sha}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}

      # J4 — kanonisk DIGEST-reference. Signaturer/attestationer gemmes i
      # registry'et pr. DIGEST, ikke pr. tag, så én operation mod digestet
      # dækker alle tags der peger på det. Digest-referencen gør også SBOM'en
      # immun over for at et mutérbart tag (latest/main) flyttes af et
      # samtidigt run mellem build og scanning.
      - id: ref
        name: canonical digest reference
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          first="${TAGS%%$'\n'*}"           # metadata-action: ét tag pr. linje
          echo "image=${first%%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # J4 — cosign keyless signing (OIDC, ingen long-lived key)
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign
        run: cosign sign --yes "${{ steps.ref.outputs.image }}"

      # J4 — Syft SBOM af PRÆCIS det byggede digest (lokal fil; cosign attest
      # bærer garantien → INGEN actions:write). Action pinnet til immutabelt
      # commit-SHA (v0.24.0) — et mutérbart major-tag kan ændre adfærd uden review.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: cosign attach SBOM
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson "${{ steps.ref.outputs.image }}"

  # Studio (editor SPA) ships as its own image built from studio/ — deployed as
  # a separate compose-service behind its own vhost, versioned with the repo.
  build-push-studio:
    name: build + push studio (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # github.sha is the CALLER's commit on a workflow_call — not the ref we
      # just checked out. Stamping it would label the image with a revision it
      # was not built from, which is exactly the drift these labels exist to
      # rule out. Read the sha from the checkout instead.
      - id: rev
        name: resolve built revision
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "::notice::building revision ${sha}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}-studio
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: studio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}

      # J4 — kanonisk DIGEST-reference. Signaturer/attestationer gemmes i
      # registry'et pr. DIGEST, ikke pr. tag, så én operation mod digestet
      # dækker alle tags der peger på det. Digest-referencen gør også SBOM'en
      # immun over for at et mutérbart tag (latest/main) flyttes af et
      # samtidigt run mellem build og scanning.
      - id: ref
        name: canonical digest reference
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          first="${TAGS%%$'\n'*}"           # metadata-action: ét tag pr. linje
          echo "image=${first%%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # J4 — cosign keyless signing (OIDC, ingen long-lived key)
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign
        run: cosign sign --yes "${{ steps.ref.outputs.image }}"

      # J4 — Syft SBOM af PRÆCIS det byggede digest (lokal fil; cosign attest
      # bærer garantien → INGEN actions:write). Action pinnet til immutabelt
      # commit-SHA (v0.24.0) — et mutérbart major-tag kan ændre adfærd uden review.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: cosign attach SBOM
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson "${{ steps.ref.outputs.image }}"
