name: Semantic Release

# §A prod-sporbarhed: udleder semver fra conventional commits (håndhævet af
# commitlint) → opretter git-tag vX.Y.Z + GitHub Release + CHANGELOG.md.
# Tag-pushet trigger repoets eksisterende release.yml → semver-tagget image.
# Changesets-ækvivalenten for ikke-npm-services (auth/permissions/notifications/...).
#
# Krav pr. repo: en semantic-release-konfiguration i roden. I DETTE repo er den
# `release.config.mjs` og IKKE `.releaserc.json` — konfigurationen har brug for en
# `writerOpts.transform`, som JSON ikke kan holde (se filens egen begrundelse).
# Denne fil distribueres på tværs af flåden, så kravet formuleres som "en
# konfiguration" frem for at navngive JSON-varianten: den tidligere ordlyd var
# usand for præcis det repo den stod i.
# Go-services har ingen package.json → tilføj en minimal én (se docs), ellers
# fejler semantic-release med ENOPKG.
#
# GitHub App-token (graceful): et GITHUB_TOKEN-pushet tag trigger IKKE release.yml
# (GitHubs recursion-prevention) → semver-imaget bygges ikke. Med et GitHub App-
# token DER pushet tag trigger release.yml. App-step'et er best-effort: uden
# org-secrets (SEMANTIC_RELEASE_APP_ID/_PRIVATE_KEY) falder vi tilbage til
# GITHUB_TOKEN (tag/release/CHANGELOG virker; image bygges når App er provisioneret).

on:
  # 🔴 TRIGGEREN FLYTTEDE FRA `workflow_run` TIL `push`, OG GATEN FULGTE MED.
  # Før hang hele release-kæden på at Actions-workflowet ved navn 'CI (Go)'
  # fuldførte. Den kobling var også en fælde: sletter man ci-go.yml, fyrer
  # semantic-release aldrig igen — ingen rød check, ingen fejlet kørsel, bare
  # ingen releases. Et fravær af hændelse kan ikke skelnes fra "intet at lave"
  # (samme klasse som de otte tags der gav nul semver-images, se release.yml).
  #
  # Nu kører den på push til main og MÅLER i stedet, før den skærer noget:
  # `scripts/release_gate.py` kræver at `Lint + Test` fra app 15368 (GitHub
  # Actions, ci-go.yml) er SUCCESS på præcis dette sha. Indtil 2026-10-22 var
  # det `jenkins/Lint + Test` fra app 4785909; resonans er offentligt, og et
  # offentligt repo kører sin CI i Actions (Allan 2026-10-22). Navn OG app-id
  # skiftede sammen — et nyt navn med det gamle id ville aldrig blive fundet,
  # og navnet alene kan enhver publicere. Enhver måde ikke at vide på er sin egen
  # exit-kode, og ingen af dem er 0 — fraværende, uafsluttet, ikke-grøn og
  # instrument-fejl er fire forskellige udfald, ikke ét.
  #
  # Bugbot-fundet fra PR #57 er stadig opfyldt: dengang var problemet en
  # push-trigger UDEN verifikation. Gaten er verifikationen, og den læser
  # check-runs på commit'et frem for at stole på en hændelses-rækkefølge.
  push:
    branches: [main]
  workflow_dispatch:

# 🔴 EN permissions-BLOK ER UDTØMMENDE: alt der ikke står her, er `none`.
# Release-gaten læser check-runs, og den rettighed stod ikke på listen, så
# GitHub gav 403 på hvert eneste opslag — i 1800 sekunder, på et check der
# beviseligt var grønt efter 2 min 46 s (kørsel 35494091081, sikkerheds
# måling på resonans#62). Tilføjer man et trin der LÆSER noget nyt, skal man
# spørge hvad blokken siger om præcis dét — ikke om det, der stod der før.
permissions:
  contents: write # opret tags + commit CHANGELOG
  issues: write # kommentér på released issues
  pull-requests: write # kommentér på released PRs
  checks: read # release-gaten læser Lint + Test (app 15368) på dette sha

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      # Empty when this run cut no release — the build job is skipped then.
      tag: ${{ steps.released.outputs.tag }}
    # 🔴 Release-commit'et bærer selv `[skip ci]`, og GitHub springer
    # push-udløste kørsler over på sådan et commit — men den adfærd er
    # implicit, og en implicit løkke-bremse er ikke en bremse man kan læse.
    # Betingelsen står derfor EKSPLICIT: en kørsel udløst af vores egen
    # release-commit stopper her, synligt, uanset hvad GitHub gør.
    # (workflow_dispatch har intet head_commit — derfor default til '').
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Mint GitHub App-token (best-effort — trigger release.yml på tag-push)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      # The fallback `|| secrets.GITHUB_TOKEN` below is DELIBERATE — the mint is
      # allowed to fail. What was unintended is that the fall was SILENT:
      # continue-on-error keeps the step green and `||` makes the result
      # indistinguishable from the successful case. Eight releases looked normal.
      #
      # The marking hangs on the POINT OF USE, not on the mint step's outcome.
      # The two are decoupled: a third consumer added later would otherwise
      # inherit the fallback without inheriting the marking. The condition is
      # therefore "the token that is USED is empty" — one condition covering
      # both a failed mint and a skipped one.
      #
      # always(): without it a skipped producer yields '', the marking's
      # condition is false, and the guard goes silent exactly when something
      # went wrong. Position alone closed that today; a reordering would open it.
      #
      # The token goes through env, never interpolated into the script.
      - name: Fastslå udgivelsens identitet
        id: identitet
        if: always()
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          # fetch-depth:0 = fuld historik til semantic-release. ref pinner til
          # det NETOP CI-verificerede commit (workflow_run's egen github.ref er
          # branch-HEAD ved trigger-tid, ikke nødvendigvis samme commit som
          # CI-runnet — head_sha undgår racet mod commits landet i mellemtiden).
          # token = App-token når tilgængeligt (så tag-pushet trigger
          # release.yml), ellers GITHUB_TOKEN.
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # 🔴 GATEN. Intet skæres, før den check der faktisk verificerer DETTE
      # commit, siger success. Beslutningen er en ren funktion af
      # check-runs-svaret og er celle-testet mod elleve fixturer (grøn,
      # fraværende, tom, uafsluttet, fejlet, `skipped`, fremmed app, den gamle
      # Jenkins-check alene, genkørsel begge veje, misdannet svar) — selvtesten
      # kører i `Lint + Test` (ci-go.yml) på hver PR.
      #
      # `timeout-seconds` på TRINNET er et bagstop for scriptets egen timeout:
      # fejler scriptet at afslutte, dør trinnet alligevel rødt frem for at
      # hænge et job der har `contents: write`.
      - name: Lint + Test skal være grøn på dette commit
        timeout-minutes: 35
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_gate.py \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --check 'Lint + Test' \
            --app-id 15368 \
            --timeout-seconds 1800

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # release.config.mjs imports conventional-changelog-angular, so the config
      # cannot load from an empty node_modules. `npm ci` is the ONE mechanism that
      # serves both the guard below and semantic-release itself — deliberately not
      # a second `-p` list, because two ways to install the same package is how
      # they drift apart.
      - name: Install release tooling
        run: npm ci

      # The step that used to print the resolved versions here is GONE, and this
      # comment is its gravestone, because the way it failed is worth keeping.
      #
      # It ran `node -p "… require('<pkg>/package.json').version"` and threw
      # ERR_PACKAGE_PATH_NOT_EXPORTED: these packages declare `exports` without
      # './package.json', so a resolver cannot reach it. That failed the Release job
      # before semantic-release ran, and `Build release images` was SKIPPED — so the
      # change that added this step stopped releases on its very first run, and the
      # only release it ever produced was none.
      #
      # 🔴 I had already hit that exact error while writing the guard, and fixed it
      # THERE by reading node_modules directly. I left the same call standing in this
      # file. It was reproducible locally the whole time — `node -p` throws on a
      # laptop too — so this was NOT CI diverging from local. I did not run the line
      # I wrote, because this step only executes on a push to main.
      #
      # No replacement: scripts/release_notes_guard.mjs below already prints all five
      # resolved versions AND asserts each against its exact pin, so printing them
      # separately was redundant from the start. The property [sikkerhed] asked for —
      # that the guard can name the version it measured — is carried by the guard's
      # own output, not by a step beside it.

      # 🔴 FAIL-CLOSED, AND BEFORE THE RELEASE ON PURPOSE.
      # v1.18.3 published a fix for a password written in cleartext to the postgres
      # container log, and the action an operator had to take was in the commit
      # body — which the notes generator drops. Measured on the published
      # artefacts: 0 occurrences on the release note, 0 in CHANGELOG.md, 1 in the
      # git commit. Nothing went red, because nothing was looking. This step looks.
      - name: Release notes must carry operator actions
        run: node scripts/release_notes_guard.mjs

      - name: Run semantic-release
        # No `-p`. The three packages are exact devDependencies, so `npm ci` above
        # installed them and npx resolves them from node_modules — the SAME tree the
        # guard read. With `-p` npx built a separate prefix and resolved its own
        # ranges at run time, which is how the guard's green stopped being about the
        # release it was supposed to cover.
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Bind the outcome to the artifact, not to an event. semantic-release
      # tags the commit it just created, so a tag pointing at HEAD is the
      # unambiguous signal that a release happened this run.
      # always(): this step feeds the marking's condition, so it is a producer
      # too — and a chain is only as robust as its least guarded producer. If
      # semantic-release fails AFTER pushing the tag, skipping this step would
      # silence the marking about a release that did happen.
      - id: released
        name: did this run cut a release?
        if: always()
        run: |
          set -euo pipefail
          # `|| true` on the whole pipeline would make "could not read tags"
          # indistinguishable from "no tag" — the same translation of a broken
          # instrument into a claim about the world that this PR exists to stop.
          if ! tags="$(git tag --points-at HEAD)"; then
            echo "::error title=Kunne ikke læse tags::git tag --points-at HEAD fejlede. Om der blev skåret et release er UKENDT — det er ikke det samme som at der ikke blev."
            exit 1
          fi
          # grep returning 1 here is a real answer: no tag matched.
          tag="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$tag" ]; then
            echo "::notice::no release cut this run — skipping image build"
          else
            echo "::notice::released $tag — building images for it"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The marking stands AFTER the release: it removes nothing, it marks. The
      # release has already happened; what was missing is that anyone knew.
      #
      # Three states, because two would let the silent one pass as the good one:
      #   ''      -> identity NOT DETERMINED (producer skipped or failed)
      #   'true'  -> published under the fallback identity
      #   'false' -> the only green state
      # Gated on released.tag so we never name a consequence of a release that
      # did not happen: no release, nothing to determine.
      #
      # The text names the CONSEQUENCE, not the mechanism — "the mint failed"
      # does not tell a reader what went wrong for them.
      - name: Udgivelsens identitet skal være afgjort og App-baseret
        if: always() && steps.identitet.outputs.fallback != 'false' && steps.released.outputs.tag != ''
        env:
          FALLBACK: ${{ steps.identitet.outputs.fallback }}
          MINT_UDFALD: ${{ steps.app-token.outcome }}
        run: |
          if [ -z "$FALLBACK" ]; then
            echo "::error title=Udgivelsens identitet ikke afgjort::Trinnet der fastslår identiteten producerede ingen værdi — det kørte ikke, eller det fejlede. Vi ved derfor IKKE hvem der pushede taget. Dette er ikke det samme som at alt gik godt: værnet kunne ikke måle, og en umålt udgivelse behandles som en fejlet."
          else
            echo "::error title=Udgivelse under fallback-identitet::Taget blev pushet af GITHUB_TOKEN, ikke App-identiteten. To følger: (1) tag-pushet trigger ikke release.yml — hos resonans bygges imaget via workflow_call-kaldet uanset, så denne følge gælder os IKKE; (2) hele release-leddet — commits, tags, GitHub-release — bærer GITHUB_TOKENs identitet, ikke App'ens."
          fi
          echo "Mint-trinnets udfald: $MINT_UDFALD (forklaring, ikke betingelse — betingelsen er at det BRUGTE token var tomt eller uafgjort)."
          exit 1

  # CALL the build rather than hoping the tag-push triggers it. The push trigger
  # in release.yml has never fired: the release commit carries [skip ci] and the
  # tag points at that commit, so eight tags produced zero semver images. A
  # called workflow either runs and reports, or fails loudly — there is no
  # silent third state.
  build:
    name: Build release images
    needs: release
    # always(): the identity marking fails the release job on purpose, and #38
    # made the image build independent of the tag-push trigger. Letting the
    # marking skip this job would re-couple them through the back door — and
    # would inflict the very consequence the marking warns about. A real
    # release failure still produces no tag, so it still builds nothing.
    if: always() && needs.release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless OIDC
    secrets: inherit
