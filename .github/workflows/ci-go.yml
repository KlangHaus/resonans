name: CI (Go)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy (verify)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy — run go mod tidy" && exit 1)

      - name: Verify formatting (gofumpt)
        run: |
          # STILL PINNED, and still not @latest: the reason a floating tag broke
          # CI without a commit has not changed, only this instance of it. The
          # hold at v0.11.0 was go >= 1.26 (gofumpt v0.12.0, 2026-09-07) against
          # a go directive kept at 1.25.13 by the golangci-lint v2.5.0 pin; the
          # go directive now reads 1.26.9, so v0.12.0 installs. Bump the go
          # directive, golangci-lint, gofumpt and govulncheck TOGETHER — each of
          # the four refused a version the others' floor forbade.
          go install mvdan.cc/gofumpt@v0.12.0
          test -z "$(gofumpt -l .)" || (echo "Run gofumpt -w ." && gofumpt -l . && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # 🔴 PINNED TO A MASTER COMMIT, and the commit is chosen for the IMAGE it
      # references — not for its version label.
      #
      # `securego/gosec`'s action.yml carries a hard-coded image digest, and the
      # action's git tags are versioned INDEPENDENTLY of it. Measured 2026-10-10:
      #   7b1b5ceb (master, 2026-10-09) -> ghcr.io/securego/gosec@sha256:a6cd2f30…  # 2.29.0
      #   deb54465 (the v2.29.0 TAG)    -> ghcr.io/securego/gosec@sha256:4342ad11…  # 2.28.0
      # The v2.29.0 tag was cut before the image bump landed on master, so pinning
      # the TAG delivered the 2.28.0 image. That image ships go1.26.5 while go.mod
      # requires >= 1.26.9, so gosec loaded ZERO of 19 packages and still printed
      # `Issues : 0`.
      #
      # a6cd2f30… is the digest that was measured scanning this tree (Files 43,
      # Lines 7256 on bc95bd4), so this pin freezes a KNOWN-GOOD scanner rather
      # than a known version number.
      #
      # 🔴 THIS STEP IS NOT GOVERNED BY OUR GOTOOLCHAIN. Measured: `GOTOOLCHAIN`
      # is set exactly once in this file (l.110, in the govulncheck step's env),
      # and gosec is a CONTAINER action — nothing we set here reaches it. Its
      # hermeticity comes from the image: [sikkerhed] measured `GOTOOLCHAIN=local`
      # in the Env of both digests. That is THEIR measurement, not mine — ghcr's
      # anonymous token flow would not yield a readable manifest from this
      # machine, so I could not confirm it myself and am not claiming to.
      #
      # 🔴 CEILING: go 1.27.0. The pinned image's config reports
      # GOLANG_VERSION 1.27.0 (the rejected one: 1.26.5), so this pin covers a go
      # directive up to 1.27.0 and no further. REVISIT when the directive moves:
      # bump this pin in the SAME change, and read the IMAGE digest in
      # action.yml — never the tag, which is what went wrong the first time.
      #
      # 🔴 EXPECTATION, NOT A MEASUREMENT: once actions are pinned by commit,
      # Dependabot's github-actions ecosystem moves a SHA pin to the latest
      # RELEASE — which for this action is v2.29.0 = deb54465 = the 2.28.0 image
      # with go1.26.5. So its first PR here will most likely propose exactly the
      # regression just removed. The assertion below is what catches it. Read
      # such a PR by the image digest in action.yml, never by the version tag.
      - name: gosec
        uses: securego/gosec@7b1b5cebe007d62fb58eacb90fc571112939ec30 # master 2026-10-09 -> image sha256:a6cd2f30
        with:
          args: -fmt=json -out=gosec-report.json -stdout ./...

      # 🔴 THE DENOMINATOR. `Issues : 0` means "nothing was FOUND" or "nothing was
      # SCANNED", and gosec prints the same words for both while exiting 0. The
      # only fields that separate them are Files and Lines — so they are asserted
      # here, and a scan that parsed nothing fails instead of passing quietly.
      #
      # 🔴 WHAT THIS DOES AND DOES NOT CLAIM. On the rejected pin the gosec STEP
      # itself was FAILURE, so that break was loud at step level — the assertion
      # would not have been what caught it, and an earlier version of this
      # comment said it would. What was actually missing: the check is not
      # required, and `Issues : 0` reads as a clean result.
      #
      # The assertion's real contribution is therefore two things: an
      # unambiguous message instead of a reader having to notice 19 load errors
      # above a zero, and coverage of the case where gosec exits 0 having parsed
      # nothing — which no step-level failure would announce at all.
      - name: gosec actually scanned something (denominator)
        run: |
          set -euo pipefail
          test -f gosec-report.json || { echo "gosec produced no report file"; exit 1; }
          python3 -c 'import json,sys; d=json.load(open("gosec-report.json")); st=d.get("Stats") or {}; f=int(st.get("files") or 0); l=int(st.get("lines") or 0); n=len(d.get("Issues") or []); print(f"gosec parsed files={f} lines={l} issues={n}"); sys.exit(0) if f>0 and l>0 else sys.exit(f"gosec scanned NOTHING (files={f} lines={l}): Issues=0 on an unparsed tree is not a clean result")'

      # govulncheck scans the stdlib of the Go that RUNS it, so it must run on
      # go.mod's directive — the toolchain the image is built with.
      #
      # 🔴 NOT golang/govulncheck-action: it has no version input and runs
      # `go install ...@latest`. v1.8.0 requires go >= 1.26, and the check went
      # red on every PR without a commit (same class as gofumpt@latest in #44).
      # Its setup-go defaults (stable + check-latest) also overrode
      # go-version-file, so it had scanned `stable` rather than what we ship.
      #
      # Fail-closed: an empty directive or a mismatching toolchain aborts,
      # instead of silently scanning some other stdlib.
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          v="$(awk '/^go [0-9]/ {print $2; exit}' go.mod)"
          test -n "$v" || { echo "could not parse the go directive from go.mod"; exit 1; }
          test "$(go env GOVERSION)" = "go${v}" || { echo "running $(go env GOVERSION), go.mod says go${v}"; exit 1; }
          # PINNED. v1.7.0 was the newest that built on go 1.25; v1.8.0 is the
          # newest MODULE version of golang.org/x/vuln and builds on go 1.26.9.
          # 🔴 Read the MODULE version, not the GitHub release tag: the repo's
          # latest release tag is v1.1.4 while the module is at v1.8.0, so the
          # two numbers run in opposite directions and the tag would date this
          # pin backwards. Measured with `go list -m -versions golang.org/x/vuln`.
          # Bump together with the go directive and golangci-lint.
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          ver_out="$(govulncheck -version)"
          echo "$ver_out"
          grep -qE '^Scanner: govulncheck@v1\.8\.0$' <<<"$ver_out" || { echo "govulncheck is NOT v1.8.0"; exit 1; }
          govulncheck ./...

      # 🔴 THE RELEASE-NOTES GUARD ALSO RUNS HERE, AND NOT ONLY IN
      # semantic-release.yml. There it protects a release; here it protects the
      # CHANGE that would break one. Without this step the first proof that
      # release.config.mjs even LOADS arrives on the release run — after merge —
      # and a config that fails to load stops releases with no red check and no
      # failed run, which is the silent class semantic-release.yml documents.
      #
      # HONEST LIMIT: this job produces `Lint + Test`, which is NOT on the
      # required list (`jenkins/Lint + Test`, `Secret scan`, `commitlint` are).
      # So this step goes RED and VISIBLE on a PR but does not block a merge.
      # Making it required is a ruleset change and belongs to [infra].
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Release notes must carry operator actions
        run: |
          npm ci
          node scripts/release_notes_guard.mjs

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
