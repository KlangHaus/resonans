name: CI (Go)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy (verify)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy — run go mod tidy" && exit 1)

      - name: Verify formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)" || (echo "Run gofumpt -w ." && gofumpt -l . && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0

      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...

      # RØD-FØR-GRØN (midlertidig, fjernes i næste commit): pin scanningen til
      # go1.26.4, en kendt-sårbar patch. Består dette step, MÅLER gaten ikke
      # toolchainen — og så beviser den grønne variant nedenfor ingenting.
      # Forventet: 8 stdlib-advisories → exit != 0.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.4'
          check-latest: false
          repo-checkout: false

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
