name: CI (Go)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy (verify)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy — run go mod tidy" && exit 1)

      - name: Verify formatting (gofumpt)
        run: |
          # PINNED, not @latest: v0.12.0 (2026-09-07) requires go >= 1.26 while
          # go.mod is held at 1.25.13 by the golangci-lint v2.5.0 pin, so the
          # floating tag broke CI without a commit. v0.11.0 is the version
          # @latest resolved to on the last green run. Bump both tools together.
          go install mvdan.cc/gofumpt@v0.11.0
          test -z "$(gofumpt -l .)" || (echo "Run gofumpt -w ." && gofumpt -l . && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0

      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...

      # `go-version-file: go.mod` er IKKE bindende for denne action: dens
      # defaults (go-version-input: stable + check-latest: true) overskriver
      # den, så gaten scannede `stable` i stedet for den toolchain imaget
      # bygges med. Læs direktivet og giv det eksplicit videre.
      #
      # Fail-closed: en tom version ville falde tilbage til `stable` og
      # genindføre præcis den blinde vinkel, så vi afbryder hellere.
      - id: goversion
        name: read go directive from go.mod
        run: |
          set -euo pipefail
          v="$(awk '/^go [0-9]/ {print $2; exit}' go.mod)"
          test -n "$v" || { echo "could not parse the go directive from go.mod"; exit 1; }
          echo "scanning stdlib for go${v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ steps.goversion.outputs.version }}
          check-latest: false
          repo-checkout: false

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
