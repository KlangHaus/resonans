name: Feature request
description: Propose something Resonans does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing this, skim "What we will probably say no to" in
        [CONTRIBUTING.md](https://github.com/KlangHaus/resonans/blob/main/CONTRIBUTING.md#what-we-will-probably-say-no-to).
        Resonans stays small on purpose: Postgres plus one binary, tenant from a verified
        token only, guards that refuse rather than degrade.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Resonans get in the way? Describe the situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
      description: Including doing it outside Resonans — in your own service, your reverse proxy, or your frontend.
    validations:
      required: false
  - type: checkboxes
    id: patch
    attributes:
      label: Contributing
      options:
        - label: I would like to send a pull request for this, and I have read the licensing section of CONTRIBUTING.md (outside code cannot be merged until the contributor licence agreement exists).
          required: false
